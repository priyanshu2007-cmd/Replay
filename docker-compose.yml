# Local development and VM deployment stack (plan: api, worker, postgres, caddy).
# Copy .env.example to .env and fill values first.
#   docker compose up
# With Supabase in production, remove the postgres service and point
# DATABASE_URL at the Supabase pooler connection string.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: ${PG_PASSWORD:-replay}
      POSTGRES_DB: replay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replay -d replay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: node apps/api/dist/server.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replay:${PG_PASSWORD:-replay}@postgres:5432/replay
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: node apps/api/dist/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replay:${PG_PASSWORD:-replay}@postgres:5432/replay
      REPLAY_STANDALONE_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
