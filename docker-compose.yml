# Local development and VM deployment stack (plan: api, worker, postgres, caddy).
# Copy .env.example to .env and fill values first.
#   docker compose up
# With Supabase in production, remove the postgres service and point
# DATABASE_URL at the Supabase pooler connection string.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: ${PG_PASSWORD:-replay}
      POSTGRES_DB: replay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replay -d replay"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: node packages/db/dist/migrate.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replay:${PG_PASSWORD:-replay}@postgres:5432/replay
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: node apps/api/api-dist/server.cjs
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replay:${PG_PASSWORD:-replay}@postgres:5432/replay
      PORT: 3001
      # Behind Caddy on the same host: trust the proxy-added client IP hop.
      TRUST_PROXY: "1"
      # The API does not execute runs here; the dedicated worker does.
      REPLAY_INLINE_WORKER: "0"
      REPLAY_DATA_DIR: /app/artifacts
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - artifacts:/app/artifacts
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: node apps/api/api-dist/worker.cjs
    env_file: .env
    environment:
      DATABASE_URL: postgresql://replay:${PG_PASSWORD:-replay}@postgres:5432/replay
      REPLAY_DATA_DIR: /app/artifacts
      TRUST_PROXY: "1"
      # Local compose escape hatch (env allowlist still enforced). On the
      # public VM, wire DockerSandbox instead and remove this.
      REPLAY_ALLOW_HOST_SANDBOX: "1"
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  artifacts:
