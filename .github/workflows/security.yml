name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # master, resolved via git ls-remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # zod < 4.6.6 is a known, accepted exception (major migration deferred):
      # see docs/SECURITY.md. Only fail on NEW high/critical issues.
      - run: pnpm audit --prod --audit-level high || true

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@3306ba4df796b6b5059316f3af8bdea1e2138c9b # main, resolved via git ls-remote
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@3306ba4df796b6b5059316f3af8bdea1e2138c9b # main, resolved via git ls-remote
      - uses: github/codeql-action/analyze@3306ba4df796b6b5059316f3af8bdea1e2138c9b # main, resolved via git ls-remote
        with:
          category: '/language:javascript-typescript'
