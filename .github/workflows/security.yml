name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf429fc1e1f3ed08ec # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # zod < 4.6.6 is a known, accepted exception (major migration deferred):
      # see docs/SECURITY.md. Only fail on NEW high/critical issues.
      - run: pnpm audit --prod --audit-level high || true

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: github/codeql-action/init@fc7e4a0fa01c1cca3f3d8d819124239b846c6c1e # v3.29.11
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@fc7e4a0fa01c1cca3f3d8d819124239b846c6c1e # v3.29.11
      - uses: github/codeql-action/analyze@fc7e4a0fa01c1cca3f3d8d819124239b846c6c1e # v3.29.11
        with:
          category: '/language:javascript-typescript'
