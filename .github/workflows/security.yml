name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # master, resolved via git ls-remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # zod < 4.6.6 is a known, accepted exception (major migration deferred):
      # see docs/SECURITY.md. Only fail on NEW high/critical issues.
      - run: pnpm audit --prod --audit-level high || true

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: github/codeql-action/init@3306ba4df796b6b5059316f3af8bdea1e2138c9b # main, resolved via git ls-remote
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@3306ba4df796b6b5059316f3af8bdea1e2138c9b # main, resolved via git ls-remote
      - uses: github/codeql-action/analyze@3306ba4df796b6b5059316f3af8bdea1e2138c9b # main, resolved via git ls-remote
        with:
          category: '/language:javascript-typescript'
