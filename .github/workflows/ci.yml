name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve types from dist/: build before checking.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm --filter @replay/web lint
      # The pipeline end-to-end test drives real Playwright tests in the
      # sandbox copy: the chromium browser must exist.
      - run: pnpm --filter @replay/demo-shop exec playwright install --with-deps chromium
      # Unit tests are hermetic: strip model credentials so nothing can call
      # a real provider even if one is configured at the repo level.
      - run: pnpm --filter @replay/agents test
        env:
          NEBIUS_API_KEY: ''
          NEBIUS_API_KEY_WATCHER: ''
          NEBIUS_API_KEY_LOCATOR: ''
          NEBIUS_API_KEY_REPRODUCER: ''
          NEBIUS_API_KEY_FIXER: ''
          NEBIUS_API_KEY_REPORTER: ''
      - run: pnpm --filter @replay/api test
        env:
          NEBIUS_API_KEY: ''
      - run: pnpm --filter @replay/video test
      - run: pnpm --filter @replay/sandbox test

  api-compose-smoke:
    name: API smoke (memory repo)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the API and boot the dist server
        run: |
          pnpm --filter @replay/api... build
          node apps/api/dist/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health > /dev/null
          curl -sf http://localhost:3001/api/samples > /dev/null
          curl -sf http://localhost:3001/api/ready > /dev/null

  web-e2e:
    name: Web build + Playwright e2e
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The web imports @replay/api (and its deps) from their dist/.
      - run: pnpm --filter @replay/api... build
      # Bake the split-port API base into the client: the tests expect live
      # mode with the API webServer on :3001.
      - run: pnpm --filter @replay/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - run: pnpm --filter @replay/web test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
