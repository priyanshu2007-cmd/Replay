name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve types from dist/: build before checking.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm --filter @replay/web lint
      # The pipeline end-to-end test drives real Playwright tests in the
      # sandbox copy: the chromium browser must exist.
      - run: pnpm --filter @replay/demo-shop exec playwright install --with-deps chromium
      # Unit tests are hermetic: strip model credentials so nothing can call
      # a real provider even if one is configured at the repo level.
      - run: pnpm --filter @replay/agents test
        env:
          NEBIUS_API_KEY: ''
          NEBIUS_API_KEY_WATCHER: ''
          NEBIUS_API_KEY_LOCATOR: ''
          NEBIUS_API_KEY_REPRODUCER: ''
          NEBIUS_API_KEY_FIXER: ''
          NEBIUS_API_KEY_REPORTER: ''
      - run: pnpm --filter @replay/api test
        env:
          NEBIUS_API_KEY: ''
      - run: pnpm --filter @replay/video test
      - run: pnpm --filter @replay/sandbox test
      - run: pnpm --filter @replay/db test

  api-compose-smoke:
    name: API + Postgres migration smoke
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay
          POSTGRES_DB: replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replay -d replay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://replay:replay@localhost:5432/replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API, run DB migrations + seed, and verify API against Postgres
        run: |
          pnpm --filter @replay/api... build
          node apps/api/api-dist/migrate.cjs
          pnpm --filter @replay/db test
          REPLAY_INLINE_WORKER=0 node apps/api/api-dist/server.cjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health > /dev/null
          curl -sf http://localhost:3001/api/samples > /dev/null
          curl -sf http://localhost:3001/api/ready > /dev/null
          curl -sf -X POST http://localhost:3001/api/runs \
            -H "Content-Type: application/json" \
            -d '{"sampleId":"cart-nan","note":"CI Postgres smoke"}' > /dev/null

  web-e2e:
    name: Web build + Playwright e2e
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The web imports @replay/api (and its deps) from their dist/.
      - run: pnpm --filter @replay/api... build
      # Bake the split-port API base into the client: the tests expect live
      # mode with the API webServer on :3001.
      - run: pnpm --filter @replay/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - run: pnpm --filter @replay/web test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
